[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amzn-rl"
version = "0.1.0"
description = "Thí nghiệm RL AMZN với kiểm soát rò rỉ dữ liệu"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = ["agent", "environment", "data", "baseline", "main", "report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
